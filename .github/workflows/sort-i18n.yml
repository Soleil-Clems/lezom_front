name: Sort translations

on:
  push:
    branches: [develop, main]
    paths:
      - "client/messages/*.json"

jobs:
  sort:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sort translation keys
        run: |
          for file in client/messages/*.json; do
            if [ -f "$file" ]; then
              jq -S . "$file" > "${file}.sorted" && mv "${file}.sorted" "$file"
            fi
          done

      - name: Commit sorted files
        uses: EndBug/add-and-commit@v9
        with:
          author_name: "github-actions[bot]"
          author_email: "github-actions[bot]@users.noreply.github.com"
          message: "chore(i18n): sort translation keys"
          add: "client/messages/*.json"
